<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is REQUIRED here: the page asks for a black-translucent
     iOS status bar, so without it the notch/Dynamic Island eats the header and
     the home indicator sits on top of the tab bar. Everything below pays that
     back with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Console</title>
<meta name="theme-color" content="#080a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spark Console">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Spark Console v2 — 4 tabs, one theme.

   Palette is NOT eyeballed. Series + status hexes come from the dataviz
   reference palette and were run through scripts/validate_palette.js against
   this page's own surface (#12141b, dark):
     series  #3987e5 / #d95926 / #199e70 → ALL CHECKS PASS
     status  good #0ca30c ↔ crit #d03b3b → CVD ΔE 4.1 (deuteranopia) = FAIL
   That last number is why every status indicator here carries a DISTINCT
   GLYPH (● ▲ ✕ ○) and not just a colour. Never signal state with hue alone.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* surfaces */
  --bg:#080a0e; --surface:#12141b; --surface-2:#171b24; --raise:#1d222d;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.14);
  /* ink */
  --ink:#f2f4f8; --ink-2:#a5adbb; --ink-3:#6c7484;
  /* series (validated categorical slots 1-3) */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  /* status (fixed, never themed) */
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --neutral:#898781;
  --cool:#3987e5;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-sm:9px;
  --shadow:0 18px 40px -12px rgba(0,0,0,.7);
  /* iOS safe areas — 0 everywhere else, so desktop is unaffected */
  --sat:env(safe-area-inset-top,0px);   --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);  --sar:env(safe-area-inset-right,0px);
  --tabbar:0px;                          /* bottom bar height; set on mobile */
}
*{box-sizing:border-box;margin:0;padding:0}
/* iOS Safari inflates text on rotation without this, which reflows the whole
   layout when the phone turns */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
  display:grid;grid-template-rows:58px minmax(0,1fr);gap:14px;padding:14px;
  height:100vh;max-width:100vw;overflow:hidden;position:relative;isolation:isolate;
  -webkit-tap-highlight-color:transparent;
}
/* 100dvh tracks the *visible* viewport, so an iOS Safari tab does not hide the
   bottom of the page behind the URL bar. Kept after the 100vh line as a
   progressive upgrade. */
@supports (height:100dvh){body{height:100dvh}}
/* ── aurora: 3 blurred blobs on the compositor. transform-only, no repaint ── */
body::before{
  content:"";position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 42% at 18% 22%,rgba(57,135,229,.20),transparent 70%),
    radial-gradient(34% 38% at 82% 12%,rgba(217,89,38,.13),transparent 70%),
    radial-gradient(40% 44% at 62% 88%,rgba(25,158,112,.11),transparent 70%);
  filter:blur(38px);animation:drift 38s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(2.5%,-2%,0) scale(1.08)}
}
body>*{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){
  body::before{animation:none}
  *{transition:none!important;animation:none!important}
}

/* ══════════════════════════ primitives ══════════════════════════ */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.good{color:var(--good)}.warn{color:var(--warn)}.crit{color:var(--crit)}
.neutral{color:var(--neutral)}.dim{color:var(--ink-2)}.faint{color:var(--ink-3)}
.t-cool{color:var(--cool)}.t-ok{color:var(--good)}.t-warm{color:var(--warn)}.t-hot{color:var(--crit)}

/* Status marks: SHAPE carries the meaning, colour reinforces it.
   ● ok · ▲ warn · ✕ bad · ○ stale — legible at 11px and under CVD. */
.st{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:14px;height:14px;font-size:10px;line-height:1;font-style:normal;
  margin-right:7px;vertical-align:-1px}
.st.ok{color:var(--good);text-shadow:0 0 9px rgba(12,163,12,.85)}
.st.warn{color:var(--warn);text-shadow:0 0 9px rgba(250,178,25,.7)}
.st.bad{color:var(--crit);text-shadow:0 0 10px rgba(208,59,59,.9)}
.st.stale{color:var(--neutral)}
.st.bad{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.card{background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.card::after{content:"";position:absolute;inset:0 0 auto;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent)}
.card>h3{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);padding:13px 16px 9px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex:none}
.card>h3 .cnt{font:400 11px/1 var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.scroll{overflow:auto;flex:1;min-height:0;padding:0 16px 14px}
.scroll::-webkit-scrollbar,.view::-webkit-scrollbar{width:7px;height:7px}
.scroll::-webkit-scrollbar-thumb,.view::-webkit-scrollbar-thumb{
  background:var(--line-2);border-radius:99px}
.empty{color:var(--ink-3);font-size:12.5px;padding:14px 2px;font-style:italic}

.btn{font:600 11.5px var(--sans);color:var(--ink-2);background:var(--raise);
  border:1px solid var(--line-2);border-radius:7px;padding:5px 11px;cursor:pointer;
  transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){color:var(--ink);border-color:var(--s1);
  box-shadow:0 0 0 3px rgba(57,135,229,.14)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.go:hover:not(:disabled){border-color:var(--good);box-shadow:0 0 0 3px rgba(12,163,12,.16)}
.btn.stop:hover:not(:disabled){border-color:var(--crit);box-shadow:0 0 0 3px rgba(208,59,59,.16)}
input[type=text],select{font:13px var(--sans);color:var(--ink);background:#0c0f15;
  border:1px solid var(--line-2);border-radius:8px;padding:7px 11px;outline:none;min-width:0}
input[type=text]:focus,select:focus{border-color:var(--s1);box-shadow:0 0 0 3px rgba(57,135,229,.16)}

/* ══════════════════════════ top bar ══════════════════════════ */
header{display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;
  background:rgba(12,15,21,.72);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:14.5px;
  letter-spacing:.2px;white-space:nowrap;margin-right:6px}
.brand .bolt{font-size:17px;filter:drop-shadow(0 0 8px rgba(57,135,229,.8))}
nav{display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:7px 15px;border-radius:9px;
  font-size:13px;font-weight:650;color:var(--ink-3);cursor:pointer;white-space:nowrap;
  border:1px solid transparent;transition:.16s;position:relative;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tab:hover{color:var(--ink-2);background:rgba(255,255,255,.04)}
.tab.on{color:var(--ink);background:rgba(57,135,229,.14);border-color:rgba(57,135,229,.4)}
.tab.on::after{content:"";position:absolute;left:15px;right:15px;bottom:-1px;height:2px;
  border-radius:2px;background:var(--s1);box-shadow:0 0 10px var(--s1)}
.tab kbd{font:600 9.5px var(--mono);color:var(--ink-3);border:1px solid var(--line);
  border-radius:4px;padding:1px 4px;background:rgba(0,0,0,.35)}
.tab .badge{font:700 10px var(--mono);border-radius:999px;padding:1px 6px;
  background:var(--crit);color:#fff}
.tab .badge.w{background:var(--warn);color:#241a03}
header .sp{flex:1}
header .err{font-size:12px;color:var(--crit);max-width:30ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
header .stamp{font:11px var(--mono);color:var(--ink-3);white-space:nowrap}
header .clock{font:650 14px var(--mono);color:var(--ink);white-space:nowrap;padding-right:8px}

/* Liveness pill — the page animates numbers continuously, so it has to say
   out loud whether those numbers are still arriving. Glyph + text, not colour
   alone (same CVD rule as every other status mark on this page). */
.live{display:inline-flex;align-items:center;gap:6px;flex:none;
  font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--good);border:1px solid rgba(12,163,12,.34);border-radius:999px;
  padding:4px 9px;background:rgba(12,163,12,.09);white-space:nowrap}
.live .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;
  box-shadow:0 0 8px currentColor;animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.live.stale{color:var(--warn);border-color:rgba(250,178,25,.34);background:rgba(250,178,25,.09)}
.live.dead{color:var(--crit);border-color:rgba(208,59,59,.4);background:rgba(208,59,59,.1)}
.live.stale .dot,.live.dead .dot{animation:none}
.live.dead .dot{box-shadow:none}

/* ══════════════════════════ views ══════════════════════════ */
.view{display:none;min-height:0;min-width:0;overflow:auto;gap:14px}
.view.on{display:grid}

/* ─────────────── PULSE ─────────────── */
#v-pulse{grid-template-rows:auto auto minmax(180px,1fr)}

/* hero verdict */
.hero{display:flex;align-items:center;gap:20px;padding:16px 22px;border-radius:var(--r);
  border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;
  background:linear-gradient(115deg,var(--surface-2),var(--surface) 60%)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(70% 200% at 0% 50%,var(--hero-glow,rgba(12,163,12,.24)),transparent 65%)}
.hero.ok{--hero-glow:rgba(12,163,12,.26)}
.hero.warn{--hero-glow:rgba(250,178,25,.24)}
.hero.bad{--hero-glow:rgba(208,59,59,.3)}
.hero>*{position:relative}
.hero .mark{font-size:34px;line-height:1;flex:none;width:46px;text-align:center}
.hero.ok .mark{color:var(--good);text-shadow:0 0 22px rgba(12,163,12,.7)}
.hero.warn .mark{color:var(--warn);text-shadow:0 0 22px rgba(250,178,25,.6)}
.hero.bad .mark{color:var(--crit);text-shadow:0 0 26px rgba(208,59,59,.8)}
.hero .msg{min-width:0;flex:1}
.hero .msg b{display:block;font-size:23px;font-weight:750;letter-spacing:-.015em;line-height:1.15}
.hero .msg span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.hero .stats{display:flex;gap:26px;flex:none}
.hero .stat{text-align:right}
.hero .stat b{display:block;font:650 21px/1.1 var(--mono);letter-spacing:-.02em}
.hero .stat span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}

/* host cards */
.hosts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.host{padding:14px 16px 12px;cursor:pointer;transition:border-color .18s,transform .18s}
.host:hover{border-color:var(--line-2);transform:translateY(-2px)}
.host .hh{display:flex;align-items:baseline;gap:0;min-width:0;margin-bottom:2px}
.host .hh b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.host .hh .up{margin-left:auto;font:10.5px var(--mono);color:var(--ink-3);white-space:nowrap;
  padding-left:8px}
.host .role{font-size:11px;color:var(--ink-3);margin-bottom:8px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gwrap{display:flex;align-items:center;gap:14px}
.gauge{width:104px;height:104px;flex:none}
.gauge circle{fill:none;stroke-width:9;stroke-linecap:round;
  transform:rotate(135deg);transform-origin:60px 60px}
.gauge .track{stroke:rgba(255,255,255,.07)}
.gauge .fill{transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1),stroke .4s;
  filter:drop-shadow(0 0 6px currentColor)}
.gauge text{fill:var(--ink);font-family:var(--sans);text-anchor:middle}
.gauge .gv{font-size:26px;font-weight:700}
.gauge .gl{font-size:9px;fill:var(--ink-3);letter-spacing:.14em;font-weight:600}
.gside{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mrow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:7px;font-size:11px}
.mrow label{color:var(--ink-3);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;min-width:0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--s1);
  transition:width .8s cubic-bezier(.22,1,.36,1),background .3s}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--crit)}
.mrow .v{font:11px var(--mono);color:var(--ink-2);white-space:nowrap}
.spark{width:100%;height:32px;display:block;margin-top:9px}
.host .foot{display:flex;gap:12px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.host .foot b{color:var(--ink-2);font-family:var(--mono);font-weight:600}
.host.bad{border-color:rgba(208,59,59,.5)}
.host.warn{border-color:rgba(250,178,25,.38)}

/* pulse bottom row */
.prow{display:grid;gap:14px;min-height:0;
  grid-template-columns:minmax(0,1.5fr) minmax(0,.85fr) minmax(0,.95fr) minmax(0,1.05fr)}

/* projects */
.prj{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:12px;
  border-bottom:1px solid var(--line);min-width:0}
.prj:last-child{border-bottom:0}
.prj .n{display:flex;align-items:center;min-width:0;flex:0 0 44%}
.prj .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prj .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-3);font-size:11px}
.prj .a{font:10.5px var(--mono);color:var(--ink-3);flex:none}

/* attention feed — the merged "what's wrong" list */
.att{display:flex;align-items:flex-start;gap:0;padding:9px 10px;border-radius:var(--r-sm);
  cursor:pointer;transition:background .15s;border-left:2px solid transparent}
.att:hover{background:rgba(255,255,255,.045)}
.att.bad{border-left-color:var(--crit)}
.att.warn{border-left-color:var(--warn)}
.att.info{border-left-color:var(--neutral)}
.att .body{min-width:0;flex:1}
.att .m{font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sub{font-size:11px;color:var(--ink-3);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.att .src{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 6px;
  margin-left:8px;flex:none;align-self:flex-start}
.allclear{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:9px;color:var(--ink-3);text-align:center;padding:20px}
.allclear .big{font-size:38px;color:var(--good);text-shadow:0 0 26px rgba(12,163,12,.6)}
.allclear b{font-size:14px;color:var(--ink-2);font-weight:600}

/* todo */
.todo{display:flex;align-items:center;gap:9px;padding:6px 2px;font-size:12.5px;
  border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{accent-color:var(--s1);width:14px;height:14px;flex:none;cursor:pointer}
.todo .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo.done .txt{color:var(--ink-3);text-decoration:line-through}
.todo .tag{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);background:var(--raise);border-radius:5px;padding:2px 6px;flex:none}
.todo .del{color:var(--ink-3);cursor:pointer;font-size:12px;flex:none;opacity:0;transition:.15s}
.todo:hover .del{opacity:1}
.todo .del:hover{color:var(--crit)}
.todo-add{display:flex;gap:6px;padding:10px 16px 14px;flex:none}
.todo-add input{flex:1;min-width:0;padding:6px 10px;font-size:12.5px}
.todo-add select{padding:6px 8px;font-size:11.5px}

/* quick actions */
.act{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.act:last-of-type{border-bottom:0}
.act .info{min-width:0;flex:1}
.act .info b{display:block;font-size:12.5px;font-weight:650}
.act .info span{display:block;font-size:11px;color:var(--ink-3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.act-out{font:10.5px/1.45 var(--mono);color:var(--ink-2);background:#0a0d12;
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin:0 0 8px;
  white-space:pre-wrap;max-height:100px;overflow:auto}

/* ─────────────── FLEET ─────────────── */
#v-fleet{grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
.node{padding:15px 17px 14px}
.node h2{display:flex;align-items:baseline;gap:9px;font-size:16px;font-weight:750;
  margin-bottom:12px;min-width:0}
.node h2 .role{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.04em}
.node h2 .up{margin-left:auto;font:11px var(--mono);color:var(--ink-3)}
.node .offline{padding:26px 4px;color:var(--crit);font-size:13px;text-align:center}
.node .offline.stale{color:var(--ink-3)}
.subhead{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:14px 0 7px;display:flex;justify-content:space-between;
  align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:11px}
.subhead .cnt{font:400 10.5px var(--mono);letter-spacing:0;text-transform:none}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:12px}
.chart{background:#0a0d12;border:1px solid var(--line);border-radius:10px;padding:8px 9px 5px;
  min-width:0;position:relative}
.chart h5{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.chart .cur{display:flex;gap:9px;font:11px var(--mono);color:var(--ink-2);
  letter-spacing:0;text-transform:none;font-weight:400}
.chart .cur span{display:flex;align-items:center;gap:4px}
.chart .cur i{width:7px;height:7px;border-radius:2px;flex:none}
.chart canvas{width:100%;height:82px;display:block;cursor:crosshair}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0;
  border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3);white-space:nowrap}
.kv .v{font-family:var(--mono);font-size:11.5px;text-align:right;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.ctrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px;
  max-height:118px;overflow:auto}
.ctr{display:flex;align-items:center;font-size:11px;padding:4px 7px;border-radius:6px;
  background:rgba(255,255,255,.035);min-width:0}
.ctr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctr.down{opacity:.55}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:5px 8px 5px 0;border-bottom:1px solid var(--line-2);
  position:sticky;top:0;background:var(--surface);z-index:1}
td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
/* model table: fixed columns so the model NAME keeps the space, not the
   two-character status column (auto layout starved it to "de…") */
.mtab{table-layout:fixed}
.mtab td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtab td:nth-child(1){width:44%}
.mtab td:nth-child(2){width:26%}
.mtab td:nth-child(3){width:16%}
.mtab td:nth-child(4){width:14%}
/* jobs table: same fix — auto layout gave a third of the width to a cron
   expression and squeezed the job NAME, the one column you actually read */
.jtab{table-layout:fixed}
.jtab td{overflow:hidden}
.jtab th:nth-child(1),.jtab td:nth-child(1){width:26px}
.jtab th:nth-child(3),.jtab td:nth-child(3){width:96px}
.jtab th:nth-child(4),.jtab td:nth-child(4){width:186px}
.jtab th:nth-child(5),.jtab td:nth-child(5){width:96px}
.jtab th:nth-child(6),.jtab td:nth-child(6){width:104px}

/* ─────────────── CONTROL / JOBS shared ─────────────── */
.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;flex:none}
.bar-row input[type=text]{flex:1;min-width:150px;max-width:320px}
.pill{font:600 11.5px var(--sans);color:var(--ink-3);background:transparent;
  border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;cursor:pointer;
  transition:.15s;white-space:nowrap}
.pill:hover{color:var(--ink-2);border-color:var(--ink-3)}
.pill.on{color:var(--ink);background:rgba(57,135,229,.16);border-color:rgba(57,135,229,.5)}
.bar-row .note{font:11.5px var(--mono);color:var(--ink-3);margin-left:auto}

#v-control,#v-jobs{grid-template-rows:auto auto minmax(0,1fr);align-content:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px;
  padding:0 14px 14px}
.svc{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;transition:.15s}
.svc:hover{border-color:var(--line-2)}
.svc.waste{border-color:rgba(250,178,25,.42)}
.svc .name{display:flex;align-items:center;font-size:12.5px;font-weight:650;min-width:0}
.svc .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc .meta{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc .used{font:10.5px var(--mono);color:var(--ink-3)}
.svc .used.waste{color:var(--warn)}
.svc .acts{display:flex;gap:5px;margin-top:3px;align-items:center;flex-wrap:wrap}
.svc .acts select{padding:4px 6px;font-size:11px;flex:1;min-width:0}
.svc .acts .btn{padding:4px 9px;font-size:11px}
.svc .open{margin-left:auto;padding-left:8px;font-size:11px;color:var(--s1);
  text-decoration:none;font-weight:600;white-space:nowrap;flex:none}
.svc .open:hover{text-decoration:underline}

.launch{display:flex;gap:9px;padding:0 14px 12px;flex-wrap:wrap}
.lt{display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:190px;transition:.15s}
.lt.up{border-color:rgba(12,163,12,.4)}
.lt .ico{font-size:17px;flex:none}
.lt .txt{min-width:0;flex:1}
.lt .txt b{display:flex;align-items:center;font-size:12.5px;font-weight:650}
.lt .txt span{display:block;font-size:10.5px;color:var(--ink-3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

.lgroup{padding:0 14px 4px}
.lgroup h4{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:10px 0 8px;display:flex;gap:9px;align-items:center}
.lgroup h4 .cnt{font:400 10.5px var(--mono);letter-spacing:0;text-transform:none}
.ltiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.ltile{display:block;text-decoration:none;color:inherit;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:0;transition:.15s}
.ltile:hover{border-color:var(--s1);transform:translateY(-1px)}
.ltile b{display:flex;align-items:center;font-size:12px;font-weight:650}
.ltile b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltile>span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltile.down{opacity:.62}

/* backup tiers */
.bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px;padding:0 14px 12px}
.bk{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  display:flex;flex-direction:column;gap:4px;min-width:0}
.bk.warn{border-color:rgba(250,178,25,.42)}
.bk.fail{border-color:rgba(208,59,59,.5)}
.bk .h{display:flex;align-items:center;gap:0;font-size:12.5px;font-weight:650;min-width:0}
.bk .h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .h .age{margin-left:auto;font:11px var(--mono);padding-left:8px;white-space:nowrap}
.bk .tier{font:600 9px var(--mono);color:var(--ink-3);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;margin-left:7px;flex:none}
.bk .d{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .n{font-size:11px;color:var(--warn)}

/* jobs table */
.jname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jdetail{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;
  border-radius:5px;padding:2px 6px;white-space:nowrap;
  background:rgba(57,135,229,.16);color:#8fc0f5}
.lay.crontab{background:rgba(217,89,38,.16);color:#f0a382}
.lay.timer{background:rgba(25,158,112,.16);color:#6fd9b2}

/* Bottom tab bar + pull-to-refresh are phone-only; the ≤760px block turns them
   on. Declared here (before that block) so the media query wins. */
.tabbar,#ptr{display:none}

/* chart tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s;
  background:rgba(10,13,18,.96);border:1px solid var(--line-2);border-radius:8px;
  padding:7px 10px;font:11.5px/1.5 var(--mono);color:var(--ink);box-shadow:var(--shadow);
  white-space:nowrap}
#tip.on{opacity:1}
#tip .tt{color:var(--ink-3);font-size:10px;margin-bottom:3px}
#tip .tr{display:flex;align-items:center;gap:6px}
#tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}

/* entrance */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view.on>*{animation:rise .42s cubic-bezier(.22,1,.36,1) backwards}
.view.on>*:nth-child(2){animation-delay:.05s}
.view.on>*:nth-child(3){animation-delay:.1s}

/* responsive */
@media (max-width:1680px){.prow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);
  grid-auto-rows:minmax(190px,auto)}
  .prow>:nth-child(4){grid-column:span 3}}
@media (max-width:1500px){.hosts{grid-template-columns:repeat(2,minmax(0,1fr))}
  #v-pulse{grid-template-rows:auto auto auto}
  .prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .prow>:nth-child(4){grid-column:auto}}
@media (max-width:1100px){#v-fleet{grid-template-columns:minmax(0,1fr)}
  .charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .prow{grid-template-columns:minmax(0,1fr)}
  .hero{flex-wrap:wrap}.hero .stats{width:100%;justify-content:flex-start}
  body{padding:9px;gap:9px}header{padding:0 6px 0 11px}
  .tab kbd{display:none}header .stamp{display:none}}

/* ═══════════════════════════════════════════════════════════════════════════
   TOUCH POINTERS
   Hover styling on a touchscreen sticks after a tap, and an affordance that
   only appears on hover (the todo ✕) is unreachable. Both fixed here rather
   than by weakening the desktop rules. ═══════════════════════════════════ */
@media (hover:none){
  .host:hover,.ltile:hover{transform:none;border-color:var(--line)}
  .btn:hover:not(:disabled){color:var(--ink-2);border-color:var(--line-2);box-shadow:none}
  .att:hover{background:none}
  .todo .del{opacity:.7}
  /* press feedback replaces hover feedback */
  .btn:active:not(:disabled){transform:scale(.96);border-color:var(--s1);
    box-shadow:0 0 0 3px rgba(57,135,229,.16)}
  .pill:active{transform:scale(.96)}
  .host:active,.att:active,.ltile:active,.svc:active{background:rgba(255,255,255,.05)}
}

/* ═══════════════════════════════════════════════════════════════════════════
   PHONE  (≤760px) — iOS-shaped: bottom tab bar in the thumb arc, swipe between
   sections, safe-area insets, 16px form text (anything smaller makes Safari
   zoom the whole page on focus), 44px touch targets.
   ═══════════════════════════════════════════════════════════════════════════ */
@media (max-width:760px){
:root{--tabbar:58px;--r:15px}

body{
  grid-template-rows:50px minmax(0,1fr);gap:9px;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 9px) 0 calc(var(--sal) + 9px);
}
body::before{filter:blur(48px)}          /* fewer blur passes on a mobile GPU */

/* ── top bar: identity + liveness only; navigation moved to the bottom ── */
header{padding:0 11px;gap:9px;border-radius:13px}
header nav#tabs,header .stamp{display:none}
.brand{font-size:14px;gap:7px;margin-right:0}
header .clock{font-size:13px;padding-right:0}

/* errors become a toast above the tab bar instead of a truncated header chip */
header .err{display:none}
header .err:not(:empty){
  display:block;position:fixed;z-index:70;
  left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);
  bottom:calc(var(--sab) + var(--tabbar) + 10px);
  max-width:none;white-space:normal;overflow:visible;text-overflow:clip;
  background:rgba(24,12,14,.96);border:1px solid rgba(208,59,59,.5);
  border-radius:11px;padding:9px 13px;font-size:12.5px;line-height:1.4;
  box-shadow:var(--shadow);animation:rise .3s cubic-bezier(.22,1,.36,1)}

/* ── views: one vertical scroller per section, clearing the fixed tab bar ──
   FLEX COLUMN, not grid. The desktop views are height-constrained grids, and
   every card here sets overflow:hidden — which zeroes its min-content size, so
   grid happily crushes a row to fit the viewport. That is what clipped the
   hero's subtitle and swallowed its stats row entirely on a 393px screen.
   A flex column with non-shrinking children lets content set its own height
   and the section scroll, which is the correct phone model anyway. */
.view.on{display:flex;flex-direction:column}
.view>*{flex:0 0 auto}
.view{gap:11px;padding-bottom:calc(var(--tabbar) + var(--sab) + 14px);
  overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{width:0;height:0}
.view.on>*{animation-duration:.3s}
.view.on>*:nth-child(n+3){animation-delay:.08s}

/* Cards grow to their content and the PAGE scrolls. Nested scroll panes are
   the wrong model on a phone — you cannot tell which surface your finger is
   dragging, and they break both the swipe and the pull-to-refresh gestures.
   Every inner .scroll therefore flows; only the section itself scrolls. */
.card{overflow:visible}
.scroll{overflow:visible;max-height:none;padding:0 14px 12px}

/* ── PULSE ── */
#v-pulse{grid-template-rows:auto auto auto}
.hero{padding:13px 15px;gap:13px;align-items:flex-start}
.hero .mark{font-size:26px;width:28px}
.hero .msg b{font-size:17px}
.hero .msg span{font-size:11.5px;white-space:normal;line-height:1.35}
.hero .stats{gap:0;width:100%;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.hero .stat{text-align:center}
.hero .stat b{font-size:15px}
.hero .stat span{font-size:8.5px;letter-spacing:.08em}

/* four host cards, two up — gauge stacks over its readouts so the bars keep
   enough width to be readable instead of collapsing to slivers */
.hosts{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.host{padding:11px 11px 9px}
/* Two hosts here are called sparkmax-10ef and sparkymaxxx-12ef. Sharing the
   line with the uptime truncated them to "sparkm…"/"sparkym…" — indistinguishable,
   which defeats the card. Uptime drops to its own line so the NAME gets the width. */
.host .hh{flex-wrap:wrap;align-items:center}
.host .hh b{font-size:12.5px;flex:1 1 auto;min-width:0}
.host .hh .up{flex:1 0 100%;margin:1px 0 0;padding:0 0 0 21px;font-size:9.5px}
.host .role{font-size:9.5px;margin:2px 0 6px}
.gwrap{flex-direction:column;gap:6px}
.gauge{width:80px;height:80px;align-self:center}
.gauge .gv{font-size:27px}
.gauge .gl{font-size:10px}
.gside{width:100%}
.mrow{grid-template-columns:24px 1fr auto;gap:5px}
.mrow label{font-size:8.5px}
.mrow .v{font-size:9.5px}
.spark{height:26px;margin-top:6px}
.host .foot{gap:7px;font-size:9.5px;margin-top:6px;padding-top:6px}

.att{padding:11px 9px}                    /* 44px row target */
.att .m{white-space:normal;font-size:12.5px;line-height:1.35}
.att .sub{white-space:normal}
.todo{padding:9px 2px}
.todo input{width:19px;height:19px}
.todo-add{flex-wrap:wrap;padding:10px 14px 14px}
.todo-add input{flex:1 1 100%}
.todo-add select{flex:1}
.prj{padding:8px 2px}
.prj .n{flex:0 0 52%}
.act{padding:11px 2px}

/* ── FLEET ── */
.node{padding:13px 13px 12px}
.node h2{font-size:14.5px;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.node h2 .up{font-size:10px}
.charts{gap:8px;margin-top:10px}
.chart{padding:7px 7px 4px}
.chart h5{font-size:9px}
.chart .cur{font-size:10px;gap:6px}
.chart canvas{height:68px}
.ctrs{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));max-height:none}

/* ── CONTROL / JOBS ── */
/* filter pills stay on ONE line and scroll sideways; wrapping them ate three
   rows of vertical space on a 390px screen */
.bar-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:10px 12px;gap:7px}
.bar-row::-webkit-scrollbar{display:none}
.bar-row input[type=text]{flex:0 0 auto;width:44vw;max-width:none;min-width:0}
.bar-row .note{margin-left:0;flex:0 0 auto;padding-right:4px}
.pill{padding:8px 14px}                   /* 36px tall, thumb-sized */
input[type=text],select{font-size:16px;padding:9px 12px}   /* 16px = no iOS zoom */

.tiles{grid-template-columns:minmax(0,1fr);gap:9px;padding:0 12px 12px}
.svc{padding:12px 13px}
.svc .name{font-size:13.5px}
.svc .acts{gap:7px;margin-top:6px}
.svc .acts .btn{flex:1;padding:9px 10px;font-size:12px;text-align:center}
.svc .acts select{flex:1 1 100%;font-size:16px}
.svc .open{padding:4px 0 4px 10px}
.launch{padding:0 12px 12px;gap:8px}
.lt{min-width:0;width:100%;padding:10px 12px}
.lt .btn{padding:9px 14px}
.lgroup{padding:0 12px 4px}
.ltiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bks{grid-template-columns:minmax(0,1fr);gap:9px;padding:0 12px 12px}

/* Jobs: a 6-column table cannot work at 390px. Same markup, re-laid out as a
   stacked card per job — glyph pinned left, name on its own line, schedule
   facts as a labelled wrap row underneath. */
.jtab thead{display:none}
.jtab,.jtab tbody,.jtab tr,.jtab td{display:block;width:auto}
.jtab tr{position:relative;padding:10px 0 10px 24px;border-bottom:1px solid var(--line)}
.jtab tr:last-child{border-bottom:0}
.jtab td{padding:0;border:0;width:auto!important;white-space:normal}
.jtab td:nth-child(1){position:absolute;left:0;top:12px;width:18px!important}
.jtab td:nth-child(2){margin-bottom:5px}
.jtab .jname{white-space:normal;font-size:13px}
.jtab .jdetail{white-space:normal;font-size:10.5px;line-height:1.35}
.jtab td:nth-child(n+3){display:inline-block;margin:0 9px 0 0;font-size:10.5px;
  white-space:nowrap!important}
.jtab td:nth-child(5)::before{content:"next ";color:var(--ink-3);font-family:var(--sans)}
.jtab td:nth-child(6)::before{content:"last ";color:var(--ink-3);font-family:var(--sans)}
.jtab td:nth-child(4){color:var(--ink-3)}
.mtab td:nth-child(1){width:40%}
.mtab td:nth-child(2){width:30%}

/* ══════════════════ bottom tab bar (thumb arc) ══════════════════ */
.tabbar{
  display:flex;position:fixed;z-index:60;left:0;right:0;bottom:0;
  padding:0 calc(var(--sar) + 6px) var(--sab) calc(var(--sal) + 6px);
  background:rgba(10,13,19,.86);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--line);
}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;height:var(--tabbar);min-width:0;background:none;border:0;cursor:pointer;
  color:var(--ink-3);font:600 9.5px/1 var(--sans);letter-spacing:.04em;
  position:relative;-webkit-tap-highlight-color:transparent;transition:color .18s;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tb.on{color:var(--s1)}
.tb.on svg{transform:translateY(-1px) scale(1.06)}
.tb.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;
  border-radius:0 0 3px 3px;background:var(--s1);box-shadow:0 0 10px var(--s1)}
.tb:active{color:var(--ink-2)}
.tb .badge{position:absolute;top:5px;left:calc(50% + 6px);font:700 9px var(--mono);
  border-radius:999px;padding:0 5px;line-height:14px;background:var(--crit);color:#fff;
  box-shadow:0 0 0 2px rgba(10,13,19,.9)}
.tb .badge.w{background:var(--warn);color:#241a03}

/* ══════════════════ pull-to-refresh ══════════════════ */
#ptr{position:fixed;z-index:55;top:calc(var(--sat) + 54px);left:50%;
  display:flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;font:600 11px var(--sans);color:var(--ink-2);
  background:rgba(18,22,30,.96);border:1px solid var(--line-2);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:translate(-50%,-14px)}
#ptr.armed,#ptr.spin{opacity:1;transform:translate(-50%,0)}
#ptr .ring{width:13px;height:13px;border-radius:50%;border:2px solid var(--line-2);
  border-top-color:var(--s1)}
#ptr.spin .ring{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* swipe transition between sections */
@keyframes slideL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.view.on.sw-l>*{animation:slideL .26s cubic-bezier(.22,1,.36,1) backwards}
.view.on.sw-r>*{animation:slideR .26s cubic-bezier(.22,1,.36,1) backwards}
}

/* very small phones (SE / mini) — one host card per row so the gauge and its
   readouts both stay legible instead of both being squeezed
   (these two blocks come AFTER the ≤760px block on purpose — they refine it) */
@media (max-width:389px){
  .hosts{grid-template-columns:minmax(0,1fr)}
  .gwrap{flex-direction:row}
  .gauge{width:84px;height:84px;align-self:auto}
  .ltiles{grid-template-columns:minmax(0,1fr)}
}

/* landscape phone: the bar bar would eat a third of a 390px-tall viewport */
@media (max-height:460px) and (max-width:900px){
  :root{--tabbar:46px}
  .tb{font-size:8.5px}
  .tb svg{width:18px;height:18px}
  .hosts{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="bolt">⚡</span>Spark Console</div>
  <nav id="tabs">
    <div class="tab on" data-tab="pulse"><kbd>1</kbd>Pulse <span class="badge" id="b-pulse" hidden></span></div>
    <div class="tab" data-tab="fleet"><kbd>2</kbd>Fleet <span class="badge" id="b-fleet" hidden></span></div>
    <div class="tab" data-tab="control"><kbd>3</kbd>Control <span class="badge" id="b-control" hidden></span></div>
    <div class="tab" data-tab="jobs"><kbd>4</kbd>Jobs <span class="badge" id="b-jobs" hidden></span></div>
  </nav>
  <span class="sp"></span>
  <span class="err" id="err"></span>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);

/* Status marks. SHAPE is the primary channel — green(#0ca30c) and red(#d03b3b)
   measure ΔE 4.1 under deuteranopia, so colour alone would be unreadable. */
const GLYPH={ok:"●",warn:"▲",bad:"✕",stale:"○"};
const st=s=>{const k=GLYPH[s]?s:"stale";return `<i class="st ${k}" role="img" aria-label="${k}">${GLYPH[k]}</i>`;};
const norm=s=>s==="ok"||s==="up"||s==="active"?"ok":s==="fail"||s==="bad"||s==="critical"||s==="down"?"bad"
  :s==="warn"||s==="warning"?"warn":"stale";
const barCls=p=>p>=90?"b":p>=75?"w":"";
const pctOf=(u,t)=>t?Math.round(u/t*100):0;

/* temp bands — cutoffs mirror fleet_nodes.temp_band. Always rendered beside the
   actual °C number, so the label is the secondary channel for the colour. */
function tempBand(c,kind="gpu"){
  if(c==null||c===""||Number.isNaN(+c))return "";
  const t=+c,cuts=({pi:[45,60,75],pkg:[55,75,90],gpu:[50,70,80]})[kind]||[50,70,85];
  return t<cuts[0]?"cool":t<cuts[1]?"ok":t<cuts[2]?"warm":"hot";
}
const tempSpan=(c,kind)=>{const b=tempBand(c,kind);
  return `<span class="${b?"t-"+b:""}">${c??"?"}°C</span>`;};

let DATA={},TAB=(location.hash||"#pulse").slice(1);
const TABS=["pulse","fleet","control","jobs"];
const phone=()=>window.matchMedia("(max-width:760px)").matches;

/* ══════════════════════ tabs ══════════════════════
   Two tab surfaces drive the same switchTab(): the desktop strip in the header
   and the phone bar pinned to the bottom. `dir` (+1 next / −1 previous) comes
   from a swipe and picks the matching slide animation. */
const SCROLLPOS={};
function switchTab(name,dir){
  if(!$("v-"+name))name="pulse";
  const prev=TAB;
  if(prev&&prev!==name&&$("v-"+prev))SCROLLPOS[prev]=$("v-"+prev).scrollTop;
  TAB=name;location.hash="#"+name;
  document.querySelectorAll(".view").forEach(v=>{
    const on=v.id==="v-"+name;
    v.classList.remove("sw-l","sw-r");
    v.classList.toggle("on",on);
    if(on){
      if(dir)v.classList.add(dir>0?"sw-l":"sw-r");
      /* restore where this section was left, the way a native tab bar does */
      if(prev!==name)v.scrollTop=SCROLLPOS[name]||0;
    }
  });
  document.querySelectorAll(".tab,.tb").forEach(t=>t.classList.toggle("on",t.dataset.tab===name));
  if(name==="fleet")requestAnimationFrame(drawAll);
}
document.querySelectorAll(".tab,.tb").forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));

/* One badge value, both tab surfaces. */
function setBadge(name,n,warnOnly){
  for(const el of [$("b-"+name),$("tb-"+name)]){
    if(!el)continue;
    el.hidden=!n;
    el.className="badge"+(n&&warnOnly?" w":"");
    el.textContent=n||"";
  }
}
document.addEventListener("keydown",e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))return;
  const map={"1":"pulse","2":"fleet","3":"control","4":"jobs"};
  if(map[e.key]){switchTab(map[e.key]);return;}
  if(e.key==="/"){e.preventDefault();
    const box={control:"svc-q",jobs:"auto-q"}[TAB];if(box)$(box).focus();return;}
  if(e.key==="r")refresh();
});
window.addEventListener("hashchange",()=>switchTab((location.hash||"#pulse").slice(1)));

/* ══════════════════════ fleet model ══════════════════════ */
const booting=h=>!!h&&!h.reachable&&/not polled yet/.test(h.error||"");
const worst=is=>!is||!is.length?"ok":is.some(i=>i.level==="critical")?"bad":"warn";

function fleetHosts(d){
  const out=[];
  const n1=d.node1||{},s=n1.system||{},g=(n1.gpus||[])[0]||{};
  const n1bad=(n1.alerts||[]).filter(a=>a.level==="critical").length;
  const n1warn=(n1.alerts||[]).filter(a=>a.level==="warning").length;
  out.push({id:"node1",name:n1.hostname||"sparkmax-10ef",role:"DGX Spark · primary",
    state:n1bad?"bad":n1warn?"warn":"ok",
    up:n1.iso_ts?new Date(n1.iso_ts).toLocaleTimeString():"—",
    dial:g.util_gpu??0,dialLabel:"GPU",
    cpu:s.cpu_pct||0,mem:s.mem_pct||0,disk:s.disk_used_pct||0,
    memTotal:s.mem_total_gb,
    memTxt:`${s.mem_used_gb??"?"}/${s.mem_total_gb??"?"}G`,
    diskTxt:`${s.disk_free_tb??"?"}TB free`,
    tempC:g.temp_c,tempKind:"gpu",powerW:n1.total_power_watts??g.power_w,
    foot:[["serving",String((n1.endpoints||[]).length)]]});

  const n2=d.node2||{};
  if(n2.reachable){
    const g2=(n2.gpus||[])[0]||{};
    out.push({id:"node2",name:n2.hostname||"sparkymaxxx-12ef",role:"DGX Spark · deep lane",
      state:(n2.swap&&n2.swap.used_gb>=2)?"warn":"ok",up:"up "+(n2.uptime||"?"),
      dial:g2.util_gpu??0,dialLabel:"GPU",
      cpu:n2.cpu_pct||0,mem:(n2.mem||{}).pct||0,disk:(n2.disk||{}).pct||0,
      memTotal:(n2.mem||{}).total_gb,
      memTxt:`${(n2.mem||{}).used_gb??"?"}/${(n2.mem||{}).total_gb??"?"}G`,
      diskTxt:`${(n2.disk||{}).free_tb??"?"}TB free`,
      tempC:g2.temp_c,tempKind:"gpu",powerW:g2.power_w,
      foot:[["models",String((n2.models||[]).length)]]});
  }else out.push(offlineHost("node2","sparkymaxxx-12ef","DGX Spark · deep lane",n2));

  const pi=d.pi||{};
  if(pi.reachable){
    out.push({id:"pi",name:pi.hostname||"raspberrypi",role:"Pi 5 · mirror + watchdog",
      state:worst(pi.issues),up:"up "+(pi.uptime||"?"),
      dial:pi.cpu_pct??0,dialLabel:"CPU",
      cpu:pi.cpu_pct||0,mem:(pi.mem||{}).pct||0,disk:(pi.disk||{}).pct||0,
      memTotal:(pi.mem||{}).total_gb,
      memTxt:`${(pi.mem||{}).used_gb??"?"}/${(pi.mem||{}).total_gb??"?"}G`,
      diskTxt:`${(pi.disk||{}).free_gb??"?"}GB free`,
      tempC:pi.temp_c,tempKind:"pi",powerW:pi.power_w,
      foot:[["watchdog",(pi.watchdog||{}).last_ago||"?"]]});
  }else out.push(offlineHost("pi","raspberrypi","Pi 5 · mirror + watchdog",pi));

  const s9=d.start9||{};
  if(s9.reachable){
    const c=s9.containers||{};
    out.push({id:"start9",name:s9.hostname||"cosmic-charcoal",role:"Start9 · self-hosted stack",
      state:worst(s9.issues),up:"up "+(s9.uptime||"?"),
      dial:s9.cpu_pct??0,dialLabel:"CPU",
      cpu:s9.cpu_pct||0,mem:(s9.mem||{}).pct||0,disk:(s9.disk_data||{}).pct||0,
      memTotal:(s9.mem||{}).total_gb,
      memTxt:`${(s9.mem||{}).used_gb??"?"}/${(s9.mem||{}).total_gb??"?"}G`,
      diskTxt:`${(s9.disk_data||{}).free_tb??"?"}TB free`,
      tempC:s9.temp_c,tempKind:"pkg",powerW:s9.power_w,
      foot:[["apps",`${c.running??"?"}/${c.total??"?"}`]]});
  }else out.push(offlineHost("start9","cosmic-charcoal","Start9 · self-hosted stack",s9));
  return out;
}
function offlineHost(id,name,role,h){
  const b=booting(h);
  return {id,name,role,state:b?"stale":"bad",up:b?"connecting…":"unreachable",
    dial:0,dialLabel:"—",cpu:0,mem:0,disk:0,memTxt:"—",diskTxt:"—",offline:true,
    foot:[[b?"status":"error",b?"first poll in progress":String(h&&h.error||"no data").slice(0,34)]]};
}

/* ══════════════════════ host cards (built once, updated in place) ══════════
   Rebuilding innerHTML every 10 s would restart every CSS transition, so the
   gauges would snap instead of sweep. Build the DOM when the host SET changes;
   after that only write values. ────────────────────────────────────────── */
const ARC=216.8, CIRC=289.0;           /* 270° of r=46 · full circumference */
let cardKeys="";
const HIST={};                          /* per-host dial trend, fed at 1 Hz */
const HIST_N=120;                       /* 120 × 1 s tick = 2 min of trace */

function hostCardHtml(h){
  return `
  <div class="card host" id="hc-${h.id}" onclick="switchTab('fleet')">
    <div class="hh"><i class="st stale" data-f="mark">○</i><b data-f="name">${esc(h.name)}</b>
      <span class="up" data-f="up"></span></div>
    <div class="role">${esc(h.role)}</div>
    <div class="gwrap">
      <svg class="gauge" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="46" stroke-dasharray="${ARC} ${CIRC}"></circle>
        <circle class="fill"  cx="60" cy="60" r="46" stroke-dasharray="${ARC} ${CIRC}"
          stroke-dashoffset="${ARC}" data-f="arc" stroke="var(--s1)" style="color:var(--s1)"></circle>
        <text class="gv" x="60" y="60" data-f="dv">–</text>
        <text class="gl" x="60" y="76" data-f="dl">${esc(h.dialLabel)}</text>
      </svg>
      <div class="gside">
        <div class="mrow"><label>cpu</label><div class="bar"><i data-f="bcpu"></i></div>
          <span class="v" data-f="vcpu"></span></div>
        <div class="mrow"><label>mem</label><div class="bar"><i data-f="bmem"></i></div>
          <span class="v" data-f="vmem"></span></div>
        <div class="mrow"><label>disk</label><div class="bar"><i data-f="bdisk"></i></div>
          <span class="v" data-f="vdisk"></span></div>
        <canvas class="spark" data-f="spark"></canvas>
      </div>
    </div>
    <div class="foot" data-f="foot"></div>
  </div>`;
}
function renderHosts(hosts){
  const key=hosts.map(h=>h.id).join("|");
  if(key!==cardKeys){$("hosts").innerHTML=hosts.map(hostCardHtml).join("");cardKeys=key;}
  hosts.forEach(h=>{
    const c=$("hc-"+h.id); if(!c)return;
    const f=n=>c.querySelector(`[data-f="${n}"]`);
    c.className="card host"+(h.state==="ok"?"":" "+h.state);
    const mark=f("mark");mark.className="st "+h.state;mark.textContent=GLYPH[h.state]||"○";
    f("name").textContent=h.name;
    f("up").textContent=h.up;
    /* gauge: colour follows load, glyph/label carries the identity */
    const p=clamp(+h.dial||0,0,100);
    const col=h.offline?"var(--neutral)":p>=90?"var(--crit)":p>=75?"var(--warn)":"var(--s1)";
    const arc=f("arc");
    arc.setAttribute("stroke-dashoffset",String(ARC*(1-p/100)));
    arc.setAttribute("stroke",col);arc.style.color=col;
    f("dv").textContent=h.offline?"–":Math.round(p)+"%";
    f("dl").textContent=h.dialLabel;
    for(const[k,val,txt]of[["cpu",h.cpu,Math.round(h.cpu)+"%"],
                           ["mem",h.mem,h.memTxt],["disk",h.disk,h.diskTxt]]){
      const b=f("b"+k);b.style.width=clamp(val||0,0,100)+"%";b.className=barCls(val||0);
      f("v"+k).textContent=txt;
    }
    const bits=[];
    if(h.powerW!=null)bits.push(`<span>power <b>${Math.round(h.powerW*10)/10} W</b></span>`);
    if(h.tempC!=null)bits.push(`<span>temp <b class="t-${tempBand(h.tempC,h.tempKind)}">${h.tempC}°C</b></span>`);
    h.foot.forEach(([k,v])=>bits.push(`<span>${esc(k)} <b>${esc(v)}</b></span>`));
    f("foot").innerHTML=bits.join("");
    drawSpark(f("spark"),HIST[h.id]||[],col);
  });
}
/* The trend buffer is fed by the 1 Hz tick, NOT by renderHosts — otherwise the
   10 s structural refresh would push duplicate samples and the trace would
   advance at two different rates depending on which call painted last. */
function pushHist(hosts){
  hosts.forEach(h=>{
    if(h.offline)return;
    const a=(HIST[h.id]=HIST[h.id]||[]);
    a.push(+h.dial||0);
    while(a.length>HIST_N)a.shift();
  });
}
function drawSpark(cv,vals,col){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h)return;
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;}
  const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  const mono=cssVar("--mono","monospace");
  if(vals.length<2){
    x.fillStyle="rgba(255,255,255,.2)";x.font="9px "+mono;
    x.fillText("collecting trend…",0,h/2+3);return;
  }
  const c=col.startsWith("var")?cssVar(col.slice(4,-1),"#3987e5"):col;
  /* Autoscale to the data's OWN range. A 0-100 axis turns a flat 95 % GPU into
     a solid slab that shows nothing; the gauge beside it already carries the
     absolute level, so this mark's job is purely shape-of-change. Because the
     axis floats, the range is printed — an unlabelled autoscaled spark makes
     a ±1 % wobble look like a cliff. */
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=Math.max(1.5,(hi-lo)*.3);
  const y0=Math.max(0,lo-pad),y1=Math.min(100,hi+pad),span=Math.max(1,y1-y0);
  const padR=vals.length?30:0;
  const plotW=Math.max(1,w-padR);
  const X=i=>i/(vals.length-1)*plotW, Y=v=>h-2-((clamp(v,y0,y1)-y0)/span)*(h-5);
  const gr=x.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,c+"4d");gr.addColorStop(1,c+"03");
  x.beginPath();vals.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.lineTo(plotW,h);x.lineTo(0,h);x.closePath();x.fillStyle=gr;x.fill();
  x.beginPath();vals.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.strokeStyle=c;x.lineWidth=1.6;x.lineJoin="round";x.lineCap="round";x.stroke();
  /* live end-point + the floating range, so the scale is never implied */
  x.beginPath();x.arc(X(vals.length-1),Y(vals[vals.length-1]),2.2,0,7);x.fillStyle=c;x.fill();
  x.fillStyle=cssVar("--ink-3","#6c7484");x.font="8px "+mono;
  x.textAlign="right";x.textBaseline="middle";
  x.fillText(`${Math.round(lo)}–${Math.round(hi)}%`,w,h/2);
}

/* ══════════════════════ hero verdict ══════════════════════ */
function renderHero(hosts,items,d){
  const bad=items.filter(i=>i.sev==="bad").length, warn=items.filter(i=>i.sev==="warn").length;
  const el=$("hero"),state=bad?"bad":warn?"warn":"ok";
  el.className="hero "+state;
  $("hero-mark").textContent=GLYPH[state];
  if(bad){$("hero-title").textContent=`${bad} thing${bad>1?"s":""} need${bad>1?"":"s"} you`;
    $("hero-sub").textContent=items.find(i=>i.sev==="bad").msg;}
  else if(warn){$("hero-title").textContent=`${warn} warning${warn>1?"s":""}`;
    $("hero-sub").textContent=items.find(i=>i.sev==="warn").msg;}
  else{$("hero-title").textContent="All systems nominal";
    $("hero-sub").textContent="nothing on the fleet needs you right now";}
  const up=hosts.filter(h=>!h.offline).length;
  const svc=(((d.services||{}).services)||[]);
  const auto=(d.automation||{}).counts||{},bk=(d.backups||{}).counts||{};
  const stat=(v,l,c)=>`<div class="stat"><b class="${c||""}">${v}</b><span>${l}</span></div>`;
  $("hero-stats").innerHTML=
    stat(`${up}/${hosts.length}`,"hosts up",up<hosts.length?"crit":"")+
    stat(`${svc.filter(s=>s.active).length}/${svc.length}`,"services")+
    (auto.failing?stat(`${auto.failing}`,"jobs failing","crit")
                 :stat(`${auto.total??0}`,"jobs"))+
    stat(`${bk.ok??0}/${bk.total??0}`,"backups",(bk.fail||bk.warn)?"warn":"");
}

/* ══════════════════════ merged attention feed ══════════════════════
   One list answering "what is wrong?" instead of four tabs to check.

   /api/overview.alerts is ALREADY the merged fleet list — server.py's
   _fleet_alerts() folds in automation.failing, automation.failed_units,
   backups.issues and project failures. Re-adding those here is what made a
   single broken job appear three times and inflated the headline count.
   So: start from the server list, and add ONLY what it does not cover. */
const tabFor=h=>/automation|backup|job/.test(h)?"jobs":/project/.test(h)?"pulse":"fleet";
function attentionItems(d,hosts){
  /* the merged list carries level/host/message only — recover the remediation
     text from the per-node alert objects, which do have .action */
  const actionFor={};
  ((d.node1||{}).alerts||[]).forEach(a=>{if(a.message)actionFor[a.message]=a.action||"";});

  const out=(d.alerts||[]).map(a=>({
    sev:a.level==="critical"?"bad":a.level==="warning"?"warn":"info",
    src:a.host||a.category||"fleet",
    msg:a.message,sub:actionFor[a.message]||"",
    tab:tabFor(String(a.host||""))}));

  const seen=out.map(o=>String(o.msg).toLowerCase()).join(" | ");
  hosts.filter(h=>h.offline&&h.state==="bad"&&!seen.includes(h.name.toLowerCase()))
    .forEach(h=>out.push({sev:"bad",src:"host",msg:`${h.name} unreachable`,sub:h.role,tab:"fleet"}));
  ((d.backups||{}).entries||[]).filter(e=>e.state!=="ok"&&!seen.includes(String(e.label).toLowerCase()))
    .forEach(e=>out.push({sev:e.state==="fail"?"bad":"warn",src:"backup",
      msg:`${e.label} — ${e.ago}`,sub:e.note||e.detail||"",tab:"jobs"}));
  const waste=((d.services||{}).waste_ids)||[];
  if(waste.length)out.push({sev:"info",src:"idle",
    msg:`${waste.length} services running with no recent use`,
    sub:waste.slice(0,6).join(", "),tab:"control"});
  const rank={bad:0,warn:1,info:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

const niceMax=v=>{for(const s of[64,128,256,512,1024,2048,5120,10240,51200,102400,1048576])
  if(v<=s)return s;return Math.ceil(v/1048576)*1048576;};
const fmtK=v=>v>=1024?(v/1024).toFixed(v>=10240?0:1)+" M/s":Math.round(v)+" K/s";
const fmtV=(v,unit)=>unit==="%"?Math.round(v)+"%":unit==="W"?(Math.round(v*10)/10)+" W":fmtK(v);

const hoverState={};
function drawChart(cv,samples,cfg,hoverX){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h)return null;
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;}
  const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  const A=cssVar("--s1","#3987e5"),B=cssVar("--s2","#d95926"),
        ink3=cssVar("--ink-3","#6c7484"),grid="rgba(255,255,255,.07)";
  const padL=30,padR=5,padT=5,padB=14;
  const pw=Math.max(1,w-padL-padR),ph=Math.max(1,h-padT-padB);
  const win=60,tmax=samples.length?samples[samples.length-1].t:0,tmin=tmax-win;
  const pts=samples.filter(s=>s.t>=tmin);
  let ymax=cfg.max||niceMax(Math.max(64,...pts.map(p=>Math.max(p[cfg.a],cfg.b?p[cfg.b]:0))));
  const X=t=>padL+(t-tmin)/win*pw, Y=v=>padT+ph-clamp(v,0,ymax)/ymax*ph;
  const tick=v=>cfg.unit==="%"?Math.round(v)+"":cfg.unit==="W"?String(Math.round(v))
    :v>=1024?(v/1024).toFixed(v>=10240?0:1)+"M":Math.round(v)+"";

  x.font="9px "+cssVar("--mono","monospace");
  for(const fr of[0,.5,1]){
    const yy=padT+ph*(1-fr);
    x.strokeStyle=grid;x.lineWidth=1;
    x.beginPath();x.moveTo(padL,yy);x.lineTo(padL+pw,yy);x.stroke();
    x.fillStyle=ink3;x.textAlign="right";x.textBaseline="middle";
    x.fillText(tick(ymax*fr),padL-4,yy+(fr===0?-1:fr===1?1:0));
  }
  x.textAlign="left";x.textBaseline="top";x.fillText(cfg.unit,padL+2,padT+1);
  x.textAlign="center";
  for(const[t,lab,al]of[[tmin,"−60s","left"],[tmin+win/2,"−30s","center"],[tmax,"now","right"]]){
    x.textAlign=al;x.fillStyle=ink3;x.fillText(lab,X(t),padT+ph+3);
  }

  const series=(f,color)=>{
    if(pts.length<2)return;
    const gr=x.createLinearGradient(0,padT,0,padT+ph);
    gr.addColorStop(0,color+"59");gr.addColorStop(1,color+"03");
    x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p.t),Y(p[f]||0)):x.moveTo(X(p.t),Y(p[f]||0)));
    x.lineTo(X(pts[pts.length-1].t),padT+ph);x.lineTo(X(pts[0].t),padT+ph);x.closePath();
    x.fillStyle=gr;x.fill();
    x.save();x.beginPath();
    pts.forEach((p,i)=>i?x.lineTo(X(p.t),Y(p[f]||0)):x.moveTo(X(p.t),Y(p[f]||0)));
    x.shadowColor=color;x.shadowBlur=9;x.strokeStyle=color;x.lineWidth=2;
    x.lineJoin="round";x.lineCap="round";x.stroke();x.restore();
  };
  if(cfg.b)series(cfg.b,B);
  series(cfg.a,A);

  let cur=pts[pts.length-1];
  if(hoverX!=null&&pts.length){
    const hx=clamp(hoverX,padL,padL+pw);
    let best=pts[0];for(const p of pts)if(Math.abs(X(p.t)-hx)<Math.abs(X(best.t)-hx))best=p;
    cur=best;
    x.strokeStyle="rgba(242,244,248,.4)";x.lineWidth=1;
    x.beginPath();x.moveTo(X(cur.t),padT);x.lineTo(X(cur.t),padT+ph);x.stroke();
    const dots=[[cfg.a,A]];if(cfg.b)dots.push([cfg.b,B]);
    for(const[f,c]of dots){
      x.save();x.shadowColor=c;x.shadowBlur=10;x.beginPath();x.arc(X(cur.t),Y(cur[f]||0),3.5,0,7);
      x.fillStyle=c;x.fill();x.strokeStyle=cssVar("--surface","#12141b");x.lineWidth=2;
      x.stroke();x.restore();}
  }
  const el=$(cv.id+"-cur");
  if(el)el.innerHTML=cur
    ?`<span><i style="background:${A}"></i>${fmtV(cur[cfg.a]||0,cfg.unit)}</span>`+
     (cfg.b?`<span><i style="background:${B}"></i>${fmtV(cur[cfg.b]||0,cfg.unit)}</span>`:"")
    :"—";
  return cur;
}
function drawAll(){
  for(const nid of["node1","node2"])for(const c of CHARTS){
    const cv=$(nid+"-"+c.key);
    if(cv)drawChart(cv,sparks[nid]||[],c,hoverState[cv.id]);}
}
/* hover layer: crosshair on canvas + an HTML tooltip that names each series */
document.addEventListener("mousemove",e=>{
  const cv=e.target;
  if(cv.tagName!=="CANVAS"||!cv.dataset.chart){hideTip();return;}
  hoverState[cv.id]=e.offsetX;
  const cfg=CHARTS.find(c=>c.key===cv.dataset.chart);
  const cur=drawChart(cv,sparks[cv.dataset.node]||[],cfg,e.offsetX);
  drawAll();
  if(!cur){hideTip();return;}
  const A=cssVar("--s1","#3987e5"),B=cssVar("--s2","#d95926");
  const ago=Math.max(0,Math.round(((sparks[cv.dataset.node]||[]).slice(-1)[0]||{t:cur.t}).t-cur.t));
  $("tip").innerHTML=`<div class="tt">${ago?`−${ago}s`:"now"}</div>`+
    `<div class="tr"><i style="background:${A}"></i>${cfg.an} ${fmtV(cur[cfg.a]||0,cfg.unit)}</div>`+
    (cfg.b?`<div class="tr"><i style="background:${B}"></i>${cfg.bn} ${fmtV(cur[cfg.b]||0,cfg.unit)}</div>`:"");
  const t=$("tip");t.classList.add("on");
  t.style.left=Math.min(e.clientX+14,innerWidth-t.offsetWidth-10)+"px";
  t.style.top=Math.max(8,e.clientY-t.offsetHeight-12)+"px";
},true);
document.addEventListener("mouseout",e=>{
  if(e.target.tagName==="CANVAS"&&e.target.dataset.chart){
    delete hoverState[e.target.id];hideTip();drawAll();}});

/* ══════════════════════════════════════════════════════════════════════════
   TOUCH LAYER
   Everything below exists because a finger is not a mouse: there is no hover
   to read a chart with, no scrollbar to reach for, and the natural way to
   change section is to throw the page sideways.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── chart scrubbing ──────────────────────────────────────────────────────
   The crosshair follows the finger. touchmove is NON-passive on purpose: once
   a scrub is horizontal we must preventDefault, or the section scrolls away
   underneath the finger while you are trying to read a value. A vertical drag
   that starts on a chart releases the scrub and scrolls normally. */
let scrubCv=null,scrubX0=0,scrubY0=0,scrubLocked=0;   /* 0 undecided 1 scrub 2 scroll */
function scrubAt(cv,clientX,clientY){
  const r=cv.getBoundingClientRect(),x=clientX-r.left;
  hoverState[cv.id]=x;
  const cfg=CHARTS.find(c=>c.key===cv.dataset.chart);
  if(!cfg)return;
  const cur=drawChart(cv,sparks[cv.dataset.node]||[],cfg,x);
  if(!cur){hideTip();return;}
  const A=cssVar("--s1","#3987e5"),B=cssVar("--s2","#d95926");
  const ago=Math.max(0,Math.round(((sparks[cv.dataset.node]||[]).slice(-1)[0]||{t:cur.t}).t-cur.t));
  const tip=$("tip");
  tip.innerHTML=`<div class="tt">${ago?`−${ago}s`:"now"}</div>`+
    `<div class="tr"><i style="background:${A}"></i>${cfg.an} ${fmtV(cur[cfg.a]||0,cfg.unit)}</div>`+
    (cfg.b?`<div class="tr"><i style="background:${B}"></i>${cfg.bn} ${fmtV(cur[cfg.b]||0,cfg.unit)}</div>`:"");
  tip.classList.add("on");
  /* park it above the finger so the hand does not cover the answer */
  tip.style.left=clamp(clientX-tip.offsetWidth/2,8,innerWidth-tip.offsetWidth-8)+"px";
  tip.style.top=Math.max(8,clientY-tip.offsetHeight-26)+"px";
}
function endScrub(){
  if(!scrubCv)return;
  delete hoverState[scrubCv.id];
  scrubCv=null;scrubLocked=0;hideTip();drawAll();
}
document.addEventListener("touchstart",e=>{
  const cv=e.target;
  if(cv.tagName!=="CANVAS"||!cv.dataset.chart||e.touches.length!==1)return;
  scrubCv=cv;scrubLocked=0;
  scrubX0=e.touches[0].clientX;scrubY0=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!scrubCv||e.touches.length!==1)return;
  const t=e.touches[0],dx=t.clientX-scrubX0,dy=t.clientY-scrubY0;
  if(!scrubLocked&&Math.hypot(dx,dy)>8)scrubLocked=Math.abs(dx)>Math.abs(dy)?1:2;
  if(scrubLocked===2){endScrub();return;}          /* vertical → hand it to the scroller */
  if(e.cancelable)e.preventDefault();
  scrubAt(scrubCv,t.clientX,t.clientY);
},{passive:false});
for(const ev of["touchend","touchcancel"])
  document.addEventListener(ev,endScrub,{passive:true});

/* ── swipe between sections ───────────────────────────────────────────────
   Only fires for a horizontal-dominant flick that did NOT start inside
   something that scrolls sideways itself (the filter-pill rows, a wide table,
   a chart) or on a control — otherwise the gesture is ambiguous and the wrong
   thing moves. */
(function(){
  let x0=0,y0=0,t0=0,live=false,decided=false;
  const guards=/^(CANVAS|INPUT|SELECT|TEXTAREA|BUTTON|A)$/;
  const blocked=el=>{
    for(let n=el;n&&n!==document.body;n=n.parentElement){
      if(guards.test(n.tagName))return true;
      const ox=getComputedStyle(n).overflowX;
      if(/auto|scroll/.test(ox)&&n.scrollWidth>n.clientWidth+4)return true;
    }
    return false;
  };
  addEventListener("touchstart",e=>{
    live=false;
    if(!phone()||e.touches.length!==1||blocked(e.target))return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
    live=true;decided=false;
  },{passive:true});
  addEventListener("touchmove",e=>{
    if(!live)return;
    const t=e.touches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(!decided&&Math.hypot(dx,dy)>12){
      decided=true;
      if(Math.abs(dy)>=Math.abs(dx))live=false;      /* vertical → a scroll, not a swipe */
    }
  },{passive:true});
  addEventListener("touchend",e=>{
    if(!live)return;live=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Date.now()-t0>800||Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.6)return;
    const next=TABS.indexOf(TAB)+(dx<0?1:-1);
    if(next<0||next>=TABS.length)return;
    switchTab(TABS[next],dx<0?1:-1);
  },{passive:true});
})();

/* ── pull to refresh ──────────────────────────────────────────────────────
   Armed only at the very top of the active section, so it can never steal a
   normal scroll. Refreshing means BOTH calls: structure and values. */
(function(){
  const THRESH=64;
  let y0=0,live=false,pulling=false,dist=0,from=null;
  const chip=()=>$("ptr"),label=()=>$("ptr-txt");
  const view=()=>$("v-"+TAB);
  /* "at top" means the section AND every nested scroller under the finger —
     otherwise pulling a half-scrolled alert list would arm the refresh */
  const atTop=()=>{
    const v=view();
    if(!v||v.scrollTop>0)return false;
    for(let n=from;n&&n!==document.body;n=n.parentElement)
      if(n.scrollTop>0&&n.scrollHeight>n.clientHeight+2)return false;
    return true;
  };
  const reset=()=>{chip().className="";pulling=false;dist=0;};
  addEventListener("touchstart",e=>{
    from=e.target;
    live=phone()&&e.touches.length===1&&atTop();
    if(live){y0=e.touches[0].clientY;pulling=false;dist=0;}
  },{passive:true});
  addEventListener("touchmove",e=>{
    if(!live)return;
    dist=e.touches[0].clientY-y0;
    if(dist<=6||!atTop()){if(pulling)reset();if(!atTop())live=false;return;}
    pulling=true;
    chip().className="armed";
    label().textContent=dist>=THRESH?"release to refresh":"pull to refresh";
  },{passive:true});
  addEventListener("touchend",async()=>{
    if(!live){reset();return;}
    live=false;
    if(!pulling||dist<THRESH){reset();return;}
    chip().className="spin";label().textContent="refreshing…";
    await refresh();await tickLoop();
    label().textContent="updated";
    setTimeout(reset,700);
  },{passive:true});
})();

/* ══════════════════════ main loop ══════════════════════
   TWO cadences, because the two payloads cost wildly different amounts:

     /api/overview  ~62 kB, ~1 s server-side (nvidia-smi + a systemd sweep on
                    the request path). Carries STRUCTURE: which hosts exist,
                    alerts, services, jobs, backups.  → 10 s (20 s on a phone)
     /api/tick      ~400 B, <5 ms (pure cache reads). Carries VALUES only.
                    → 1 s, which is what actually makes the page feel live.

   Both stop dead while the tab is hidden — on an iPhone a backgrounded PWA
   should not be draining battery or cellular data — and both fire immediately
   on the way back so you never stare at a stale screen. */
let HOSTS=[];               /* last host models — patched in place by the tick */
let LAST_TICK=0, tickBusy=false;

async function refresh(){
  try{
    const d=await(await fetch("/api/overview",{cache:"no-store"})).json();
    DATA=d;
    const hosts=fleetHosts(d);
    HOSTS=hosts;
    const items=attentionItems(d,hosts);
    renderHero(hosts,items,d);
    renderHosts(hosts);
    renderAttention(items);
    renderTodos(d.todos||[]);
    renderProjects(d.projects||[]);
    renderActions(d.actions||[]);
    renderLaunch(d.launch||[]);
    renderFleet(d);
    renderControl();
    renderJobs();
    setBadge("fleet",hosts.filter(h=>h.state==="bad").length,false);
    $("stamp").textContent="updated "+new Date().toLocaleTimeString();
    $("err").textContent="";
  }catch(e){$("err").textContent="refresh failed: "+e.message;}
}

/* Patch the live numbers onto the host models the last refresh built, then
   repaint. Structure (which hosts, what state, alerts) is deliberately NOT
   touched here — that stays the 10 s call's job. */
function applyTick(t){
  if(!HOSTS.length)return;
  const num=(v,cur)=>typeof v==="number"?v:cur;
  HOSTS.forEach(h=>{
    const s=t[h.id];
    if(!s||h.offline||s.reachable===false)return;
    h.dial=num(h.id==="node1"||h.id==="node2"?s.gpu:s.cpu,h.dial);
    h.cpu=num(s.cpu,h.cpu);
    h.mem=num(s.mem,h.mem);
    if(h.memTotal&&typeof s.mem==="number")
      h.memTxt=`${(s.mem/100*h.memTotal).toFixed(1)}/${h.memTotal}G`;
    if(typeof s.temp==="number"&&s.temp>0)h.tempC=s.temp;
    if(typeof s.pwr==="number"&&s.pwr>0)h.powerW=s.pwr;
  });
  pushHist(HOSTS);
  renderHosts(HOSTS);
}
async function tickLoop(){
  if(document.hidden||tickBusy)return;
  tickBusy=true;
  try{
    const t=await(await fetch("/api/tick",{cache:"no-store"})).json();
    applyTick(t);
    LAST_TICK=Date.now();
  }catch(e){/* the liveness pill below is the visible consequence */}
  finally{tickBusy=false;paintLive();}
}
/* Says out loud whether the animating numbers are still arriving. A dashboard
   that silently freezes on last-known-good is worse than one that admits it. */
function paintLive(){
  const el=$("live"),txt=$("live-txt");
  if(!el)return;
  if(!LAST_TICK){el.className="live stale";txt.textContent="…";return;}
  const age=(Date.now()-LAST_TICK)/1000;
  if(age<4){el.className="live";txt.textContent="live";}
  else if(age<45){el.className="live stale";txt.textContent=Math.round(age)+"s ago";}
  else{el.className="live dead";txt.textContent="no data";}
}

const clockTick=()=>$("clock").textContent=new Date().toLocaleTimeString();
clockTick();setInterval(clockTick,1000);
setInterval(paintLive,1000);
switchTab(TAB);
refresh();tickLoop();

/* structural cadence: easier on a phone's radio, since the 1 Hz tick already
   carries everything that visibly moves */
setInterval(()=>{if(!document.hidden)refresh();},phone()?20000:10000);
setInterval(tickLoop,1000);

document.addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  paintLive();refresh();tickLoop();
  if(TAB==="fleet")pollSparks();
});

window.addEventListener("resize",()=>{
  if(TAB==="fleet")drawAll();
  document.querySelectorAll(".spark").forEach(cv=>{
    const id=(cv.closest(".host")||{}).id;
    if(id)drawSpark(cv,HIST[id.slice(3)]||[],"var(--s1)");});
});
</script>
</body>
</html>
